openapi: 3.1.0
info:
  title: Coffee Shop Online Ordering API
  description: REST API for Coffee Shop Online Ordering System (Sprint 1 MVP)
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      description: Creates a new user profile with hashed password credentials.
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Email address is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payload validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate user and obtain JWT token
      description: Validates email and password, returning a Bearer JWT access token.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Payload validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Get current user profile
      description: Fetches authenticated user information using Bearer token.
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - HTTPBearer: []
  /health:
    get:
      tags:
      - System
      summary: Health check endpoint
      description: Liveness probe returning application operational status.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Health Get
components:
  schemas:
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
          description: Machine-readable error code
          example: validation_failed
        message:
          type: string
          title: Message
          description: Human-readable error explanation
          example: Field validation failed
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
          description: Granular error metadata or field pointers
      type: object
      required:
      - code
      - message
      title: ErrorResponse
      description: Standard error response structure as required by engineering specifications.
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: User email address
          example: user@example.com
        password:
          type: string
          title: Password
          description: Account password
          example: SecurePass123!
      type: object
      required:
      - email
      - password
      title: LoginRequest
      description: User login payload.
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: Unique email address
          example: user@example.com
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
          description: Password must be at least 8 characters and contain both letters
            and digits
          example: SecurePass123!
        full_name:
          type: string
          maxLength: 100
          minLength: 2
          title: Full Name
          description: Full name of the user
          example: Ivan Kovalenko
      type: object
      required:
      - email
      - password
      - full_name
      title: RegisterRequest
      description: User registration payload.
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
          description: JWT Bearer access token
        token_type:
          type: string
          title: Token Type
          description: Token type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
          description: Token lifespan in seconds
          example: 3600
      type: object
      required:
      - access_token
      - expires_in
      title: TokenResponse
      description: Authentication token response payload.
    UserResponse:
      properties:
        email:
          type: string
          format: email
          title: Email
          description: User email address
          example: user@example.com
        full_name:
          type: string
          maxLength: 100
          minLength: 2
          title: Full Name
          description: User full name
          example: Ivan Kovalenko
        id:
          type: integer
          title: Id
          description: Unique user identifier
          example: 1
        is_active:
          type: boolean
          title: Is Active
          description: Account active status
          example: true
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp when account was created
      type: object
      required:
      - email
      - full_name
      - id
      - is_active
      - created_at
      title: UserResponse
      description: User response schema returned to clients. Never exposes password
        hash.
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
