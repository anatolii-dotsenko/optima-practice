name: CI Pipeline

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  backend-checks:
    name: Backend Lint, Format & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project/backend/requirements.txt pytest ruff

      - name: "Gate 1: Code Linting (ruff)"
        run: |
          ruff check project/backend

      - name: "Gate 2: Code Formatting (ruff format)"
        run: |
          ruff format --check project/backend

      - name: "Gate 3: Test Suite Execution (pytest)"
        run: |
          PYTHONPATH=project/backend pytest project/backend/tests -v

      - name: "Gate 4: API Docs Completeness Check"
        run: |
          test -f project/docs/api/openapi.yaml
          test -f project/docs/api/README.md
          test -f project/docs/api/endpoints/register.md
          test -f project/docs/api/endpoints/login.md
          test -f project/docs/api/endpoints/me.md
          echo "API documentation verification passed."
